name: Auth service CI
on:
  push:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
      - 'helm/auth-service/**'
  pull_request:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
      - 'helm/auth-service/**'
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/auth-service/pom.xml
      - run: chmod +x mvnw
      - run: ./mvnw clean verify -B
  docker:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" services/auth-service
