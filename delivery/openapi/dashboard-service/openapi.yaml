openapi: 3.1.0
info:
  title: Dashboard Service API
  description: "Datos públicos agregados de dólar, FX, criptomonedas, bolsa y noticias\
    \ de IA/tecnología. Los fallos de un proveedor se informan en la lista degraded\
    \ sin cambiar el status HTTP. Con DASHBOARD_USE_MOCK=true las respuestas usan\
    \ fixtures estáticas y el ejemplo de este contrato."
  version: "1.0"
servers:
- url: http://localhost:8081
  description: Entorno local
tags:
- name: Dashboard
  description: Datos públicos agregados de mercado y noticias
paths:
  /api/v1/dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Obtener el dashboard agregado
      description: "Resumen de dólar ARS, criptomonedas y bolsa. Los fallos se informan\
        \ en degraded."
      operationId: getSummary
      responses:
        "401":
          description: "JWT ausente, inválido o expirado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Datos agregados del dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
              examples:
                modoMock:
                  $ref: "#/components/examples/SummaryMock"
        "500":
          description: Error interno inesperado durante la orquestación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                errorInterno:
                  $ref: "#/components/examples/InternalError"
      security:
      - bearerAuth: []
  /api/v1/dashboard/news:
    get:
      tags:
      - Dashboard
      summary: Obtener noticias IA/tecnología
      description: El fallback HN es normal. degraded solo indica el fallo de ambas
        fuentes.
      operationId: getNews
      parameters:
      - name: topic
        in: query
        description: Único tópico soportado
        required: false
        schema:
          type: string
          enum:
          - ai-tech
      - name: limit
        in: query
        description: Máximo de artículos
        required: false
        schema:
          type: integer
          format: int32
          default: 8
          maximum: 8
          minimum: 1
      responses:
        "200":
          description: "Noticias disponibles, frescas o stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"
              examples:
                modoMock:
                  $ref: "#/components/examples/NewsMock"
        "400":
          description: Tópico o límite inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "JWT ausente, inválido o expirado"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/dashboard/charts:
    get:
      tags:
      - Dashboard
      summary: Obtener la serie histórica de un activo
      description: Últimos siete días; si falla el proveedor devuelve datos stale
        o puntos vacíos.
      operationId: getCharts
      parameters:
      - name: asset
        in: query
        description: Activo soportado
        required: true
        schema:
          type: string
          enum:
          - BTC
          - ETH
          - AAPL
          - MSFT
          - SPY
      - name: range
        in: query
        description: Ventana histórica
        required: false
        schema:
          type: string
          enum:
          - 7d
      responses:
        "200":
          description: Serie histórica disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartsResponse"
              examples:
                modoMock:
                  $ref: "#/components/examples/ChartsMock"
        "400":
          description: Activo o rango no soportado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "JWT ausente, inválido o expirado"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - BAD_REQUEST
          - NOT_FOUND
          - CONFLICT
          - INTERNAL_ERROR
          - UNAUTHORIZED
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        timestamp:
          type: string
          format: date-time
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    CryptoQuote:
      type: object
      properties:
        priceUsd:
          type: number
        change24hPct:
          type: number
    EquityQuote:
      type: object
      properties:
        price:
          type: number
        currency:
          type: string
    FxSection:
      type: object
      properties:
        quotes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RateQuote"
    RateQuote:
      type: object
      properties:
        compra:
          type: number
        venta:
          type: number
    SummaryResponse:
      type: object
      properties:
        brand:
          type: string
        generatedAt:
          type: string
          format: date-time
        fx:
          $ref: "#/components/schemas/FxSection"
        crypto:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CryptoQuote"
        equities:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EquityQuote"
        degraded:
          type: array
          items:
            type: string
    NewsArticleResponse:
      type: object
      description: Noticia de IA y tecnología normalizada
      properties:
        id:
          type: string
          description: Identificador de la noticia (URL en NewsAPI u objectID en HN)
          example: demo-ai
        title:
          type: string
          description: Título
          example: AI research demo
        summary:
          type: string
          description: Resumen o descripción
          example: Static AI news fixture
        source:
          type: string
          description: Fuente de la noticia
          example: Meridian Demo
        publishedAt:
          type: string
          format: date-time
          description: Fecha de publicación en UTC
          example: 2026-01-01T12:00:00Z
        url:
          type: string
          description: URL del artículo
          example: https://example.com/demo-ai
        topic:
          type: string
          description: Tema de la noticia; siempre ai-tech
          example: ai-tech
    NewsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticleResponse"
        degraded:
          type: boolean
    ChartPoint:
      type: object
      properties:
        t:
          type: string
          format: date-time
          description: Fecha UTC
          example: 2026-10-22T00:00:00Z
        v:
          type: number
          description: Precio en USD
          example: 67000
    ChartsResponse:
      type: object
      properties:
        asset:
          type: string
          description: Activo normalizado
          example: BTC
        range:
          type: string
          description: Ventana histórica
          example: 7d
        points:
          type: array
          description: Puntos ordenados por fecha
          items:
            $ref: "#/components/schemas/ChartPoint"
        degraded:
          type: boolean
          description: Fallo del proveedor sin caché fresca
          example: false
  examples:
    NewsMock:
      summary: Noticias en modo mock
      value:
        items:
        - id: demo-ai
          title: AI research demo
          summary: Static AI news fixture
          source: Meridian Demo
          publishedAt: 2026-01-01T12:00:00Z
          url: https://example.com/demo-ai
          topic: ai-tech
        - id: demo-tech
          title: Technology demo
          summary: Static technology news fixture
          source: Meridian Demo
          publishedAt: 2026-01-02T12:00:00Z
          url: https://example.com/demo-tech
          topic: ai-tech
        degraded: false
    ChartsMock:
      summary: Serie BTC en modo mock
      value:
        asset: BTC
        range: 7d
        points:
        - t: 2026-10-15T00:00:00Z
          v: 67000.0
        - t: 2026-10-16T00:00:00Z
          v: 67000.0
        - t: 2026-10-17T00:00:00Z
          v: 67000.0
        - t: 2026-10-18T00:00:00Z
          v: 67000.0
        - t: 2026-10-19T00:00:00Z
          v: 67000.0
        - t: 2026-10-20T00:00:00Z
          v: 67000.0
        - t: 2026-10-21T00:00:00Z
          v: 67000.0
        - t: 2026-10-22T00:00:00Z
          v: 67000.0
        degraded: false
    SummaryMock:
      summary: Dashboard en modo mock
      description: Respuesta completa con DASHBOARD_USE_MOCK=true; los valores son
        fixtures estáticas y no cotizaciones reales.
      value:
        brand: Meridian
        generatedAt: 2026-10-22T10:05:00Z
        fx:
          quotes:
            usd_blue:
              compra: 1200.0
              venta: 1220.0
            usd_oficial:
              compra: 1000.0
              venta: 1040.0
        crypto:
          ethereum:
            priceUsd: 3500.0
            change24hPct: -1.2
          bitcoin:
            priceUsd: 67000.0
            change24hPct: 2.5
        equities:
          AAPL:
            price: 175
            currency: USD
          SPY:
            price: 450.0
            currency: USD
          MSFT:
            price: 415
            currency: USD
        degraded: []
    InternalError:
      summary: Error interno
      description: Error inesperado durante la orquestación; no expone detalles internos.
      value:
        code: INTERNAL_ERROR
        message: Error interno
        details: []
        timestamp: 2026-10-22T10:05:00Z
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
