services:
  dashboard-service:
    build: .
    image: dashboard-service:local
    ports:
      - "${PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: "8081"
      # Obligatoria: mismo valor que JWT_SECRET de auth-service (mínimo 32 bytes).
      JWT_SECRET: ${JWT_SECRET:?Configurar JWT_SECRET con el mismo valor que auth-service}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-60}
      DASHBOARD_USE_MOCK: ${DASHBOARD_USE_MOCK:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
