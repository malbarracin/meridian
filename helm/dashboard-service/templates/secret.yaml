{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashboard.name" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  FINNHUB_API_KEY: {{ .Values.secrets.finnhubApiKey | b64enc | quote }}
  NEWS_API_KEY: {{ .Values.secrets.newsApiKey | b64enc | quote }}
{{- end }}
