apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard.name" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: "prod"
  PORT: "8081"
  DASHBOARD_CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | quote }}
  DASHBOARD_USE_MOCK: {{ .Values.config.useMock | quote }}
