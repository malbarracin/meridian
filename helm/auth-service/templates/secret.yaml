{{- if not .Values.mongo.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-service.fullname" . }}
  labels:
    {{- include "auth-service.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_URI: {{ required "Set mongo.uri or mongo.existingSecret" .Values.mongo.uri | quote }}
{{- end }}
