apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth-service.fullname" . }}
  labels:
    {{- include "auth-service.selectorLabels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfile | quote }}
  MONGO_DATABASE: {{ .Values.mongo.database | quote }}
  PORT: "8080"
  JWT_EXPIRATION_MS: {{ .Values.jwt.expirationMs | quote }}
  SEED_DEMO_EMAIL: {{ .Values.seedDemo.email | quote }}
